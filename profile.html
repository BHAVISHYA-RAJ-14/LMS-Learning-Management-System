<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLA LMS - User Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">GLA LMS</div>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="courses.html">Courses</a></li>
      <li><a href="assignments.html">Assignments</a></li>
      <li><a href="profile.html" class="active">Profile</a></li>
      <li><button onclick="handleLogout()" class="btn-primary" style="padding: 0.4rem 0.8rem; width: auto;">Logout</button></li>
    </ul>
  </nav>

  <div class="main-container">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
      <div class="avatar" id="avatar">?</div>
      <h3>Academic Profile Details</h3>
      <div style="margin-top: 1rem;">
        <p><strong>Name:</strong> <span id="prof-name">-</span></p>
        <p><strong>ID / Roll No:</strong> <span id="prof-id">-</span></p>
        <p><strong>Email:</strong> <span id="prof-email">-</span></p>
        <p><strong>Role:</strong> <span id="prof-role" style="text-transform: capitalize;">-</span></p>
        <p><strong>Department:</strong> <span id="prof-dept">-</span></p>
        <p id="semRow" style="display: none;"><strong>Semester:</strong> <span id="prof-sem"></span></p>
      </div>
      <div style="margin-top: 1.25rem; display: flex; gap: 0.75rem;">
        <button class="btn-primary" id="editBtn" style="width: auto;">Edit name</button>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const user = checkAuth();

    function showProfile() {
      const initials = user.name.replace(/^(Prof\.|Dr\.)\s*/, "").split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
      document.getElementById("avatar").textContent = initials;
      document.getElementById("prof-name").textContent = user.name;
      document.getElementById("prof-id").textContent = user.rollNo || user.id;
      document.getElementById("prof-email").textContent = user.username;
      document.getElementById("prof-role").textContent = user.role;
      document.getElementById("prof-dept").textContent = user.department || "Computer Engineering";
      if (user.semester) {
        document.getElementById("semRow").style.display = "block";
        document.getElementById("prof-sem").textContent = user.semester;
      }
    }

    if (user) {
      showProfile();
      document.getElementById("editBtn").addEventListener("click", () => {
        const newName = prompt("Enter your name:", user.name);
        if (newName && newName.trim()) {
          user.name = newName.trim();
          sessionStorage.setItem("currentUser", JSON.stringify(user));
          showProfile();
        }
      });
    }
  </script>
</body>
</html>
